version: '3.8'   # obsoleto no Compose v2 (gera so um aviso); mantido por fidelidade ao enunciado
services:
  server-tcp:
    image: networkstatic/iperf3
    container_name: server_tcp_cc
    cap_add:
      - NET_ADMIN
    command: -s
    networks:
      net_bench:
        ipv4_address: 172.20.0.10

  server-http3:
    image: caddy:2.7-alpine
    container_name: server_http3_quic
    cap_add:
      - NET_ADMIN
    volumes:
      - ./certs:/etc/caddy/certs:ro
      - ./site:/usr/share/caddy:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.30

  client-bench:
    # O enunciado usa curlimages/curl:latest, cujo curl pode nao ter HTTP/3. Esta imagem e construida em ./client:
    # curl + OpenSSL 3.5 + ngtcp2 + nghttp3 (HTTP/3 com retomada de sessao e early data/0-RTT), mais iperf3 e tc.
    build: ./client
    image: tp3-client
    container_name: client_bench
    user: root              # necessario para instalar pacotes (apk) no cliente, se faltar algo
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.tcp_no_metrics_save: 1   # o TCP nao reaproveita ssthresh/RTT da repeticao anterior (amostras independentes)
    entrypoint: ["sleep", "infinity"]
    networks:
      net_bench:
        ipv4_address: 172.20.0.50

networks:
  net_bench:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16